# Tests and builds every pull request and every change to main.
name: Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Let every combination finish, so one failure doesn't hide what happens on the others.
      fail-fast: false
      matrix:
        # The three systems the installers are built for.
        os: [ubuntu-latest, windows-latest, macos-latest]
        # The oldest supported Node, and the recommended one.
        node-version: [22.23.4, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
